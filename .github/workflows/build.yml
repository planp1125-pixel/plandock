name: Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: install dependencies (ubuntu-only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libudev-dev
      - name: install frontend dependencies
        working-directory: plan-terminal
        run: npm install
      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-${{ github.ref_name }} # title for release
          releaseName: "Plan Terminal ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          projectPath: plan-terminal

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: install frontend dependencies
        working-directory: plan-terminal
        run: npm install
      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-${{ github.ref_name }}
          releaseName: "Plan Terminal ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          projectPath: plan-terminal
          args: --target x86_64-pc-windows-msvc

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: install frontend dependencies
        working-directory: plan-terminal
        run: npm install
      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-${{ github.ref_name }}
          releaseName: "Plan Terminal ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          projectPath: plan-terminal
          args: --bundles app,dmg
          # Note: MacOS builds require valid signing identity for full distribution.
          # If not configured, it will build unsign/ad-hoc.

  build-linux-arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build on ARM64 (Raspberry Pi)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          setup: |
            mkdir -p "${PWD}/artifacts"
          dockerRunArgs: |
            --volume "${PWD}/artifacts:/artifacts"
          install: |
            apt-get update -y
            apt-get install -y curl wget build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libudev-dev
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          run: |
            export PATH="$HOME/.cargo/bin:$PATH"
            export CARGO_BUILD_JOBS=2
            export RUSTFLAGS="-C codegen-units=1"
            cd plan-terminal
            npm install
            npm run tauri build
            cp src-tauri/target/release/bundle/deb/*.deb /artifacts/ || true
            cp src-tauri/target/release/bundle/appimage/*.AppImage /artifacts/ || true
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: app-${{ github.ref_name }}
          files: |
            artifacts/*.deb
            artifacts/*.AppImage
