name: Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: install dependencies (ubuntu-only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libudev-dev
      - name: install frontend dependencies
        working-directory: plan-terminal
        run: npm install
      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-${{ github.ref_name }} # title for release
          releaseName: "Plan Terminal ${{ github.ref_name }}"
          releaseBody: |
            ### 📦 Download & Installation Compatibility Guide:

            | Platform / Operating System | File Name to Download | Target Hardware |
            | :--- | :--- | :--- |
            | 🍓 **Raspberry Pi OS (32-bit `armhf`)** | `Plan.Terminal_*_armhf.deb` | **Raspberry Pi 3, 4, 5 (32-bit OS)** |
            | 🍓 **Raspberry Pi OS (64-bit `arm64`)** | `Plan.Terminal_*_arm64.deb` | **Raspberry Pi 3, 4, 5 (64-bit OS)** |
            | 🍓 **Raspberry Pi Portable (64-bit ARM)** | `Plan.Terminal_aarch64.app.tar.gz` | **Raspberry Pi (Portable tarball)** |
            | 🪟 **Windows PC (64-bit)** | `Plan.Terminal_*_x64-setup.exe` | **Windows 10, 11 (PC / Laptops)** |
            | 🍎 **macOS (Apple Silicon & Intel)** | `Plan.Terminal_*_aarch64.dmg` / `.app` | **MacBook, Mac Mini, iMac** |
            | 🐧 **Linux PC (Debian / Ubuntu x86_64)** | `Plan.Terminal_*_amd64.deb` | **Ubuntu, Debian, Mint PC** |
            | 🐧 **Linux PC (AppImage x86_64)** | `Plan.Terminal_*_amd64.AppImage` | **Fedora, Arch, openSUSE PC** |
          releaseDraft: false
          prerelease: false
          projectPath: plan-terminal

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: install frontend dependencies
        working-directory: plan-terminal
        run: npm install
      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-${{ github.ref_name }}
          releaseName: "Plan Terminal ${{ github.ref_name }}"
          releaseBody: |
            ### 📦 Download & Installation Compatibility Guide:

            | Platform / Operating System | File Name to Download | Target Hardware |
            | :--- | :--- | :--- |
            | 🍓 **Raspberry Pi OS (32-bit `armhf`)** | `Plan.Terminal_*_armhf.deb` | **Raspberry Pi 3, 4, 5 (32-bit OS)** |
            | 🍓 **Raspberry Pi OS (64-bit `arm64`)** | `Plan.Terminal_*_arm64.deb` | **Raspberry Pi 3, 4, 5 (64-bit OS)** |
            | 🍓 **Raspberry Pi Portable (64-bit ARM)** | `Plan.Terminal_aarch64.app.tar.gz` | **Raspberry Pi (Portable tarball)** |
            | 🪟 **Windows PC (64-bit)** | `Plan.Terminal_*_x64-setup.exe` | **Windows 10, 11 (PC / Laptops)** |
            | 🍎 **macOS (Apple Silicon & Intel)** | `Plan.Terminal_*_aarch64.dmg` / `.app` | **MacBook, Mac Mini, iMac** |
            | 🐧 **Linux PC (Debian / Ubuntu x86_64)** | `Plan.Terminal_*_amd64.deb` | **Ubuntu, Debian, Mint PC** |
            | 🐧 **Linux PC (AppImage x86_64)** | `Plan.Terminal_*_amd64.AppImage` | **Fedora, Arch, openSUSE PC** |
          releaseDraft: false
          prerelease: false
          projectPath: plan-terminal
          args: --target x86_64-pc-windows-msvc

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: install frontend dependencies
        working-directory: plan-terminal
        run: npm install
      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-${{ github.ref_name }}
          releaseName: "Plan Terminal ${{ github.ref_name }}"
          releaseBody: |
            ### 📦 Download & Installation Compatibility Guide:

            | Platform / Operating System | File Name to Download | Target Hardware |
            | :--- | :--- | :--- |
            | 🍓 **Raspberry Pi OS (32-bit `armhf`)** | `Plan.Terminal_*_armhf.deb` | **Raspberry Pi 3, 4, 5 (32-bit OS)** |
            | 🍓 **Raspberry Pi OS (64-bit `arm64`)** | `Plan.Terminal_*_arm64.deb` | **Raspberry Pi 3, 4, 5 (64-bit OS)** |
            | 🍓 **Raspberry Pi Portable (64-bit ARM)** | `Plan.Terminal_aarch64.app.tar.gz` | **Raspberry Pi (Portable tarball)** |
            | 🪟 **Windows PC (64-bit)** | `Plan.Terminal_*_x64-setup.exe` | **Windows 10, 11 (PC / Laptops)** |
            | 🍎 **macOS (Apple Silicon & Intel)** | `Plan.Terminal_*_aarch64.dmg` / `.app` | **MacBook, Mac Mini, iMac** |
            | 🐧 **Linux PC (Debian / Ubuntu x86_64)** | `Plan.Terminal_*_amd64.deb` | **Ubuntu, Debian, Mint PC** |
            | 🐧 **Linux PC (AppImage x86_64)** | `Plan.Terminal_*_amd64.AppImage` | **Fedora, Arch, openSUSE PC** |
          releaseDraft: false
          prerelease: false
          projectPath: plan-terminal
          args: --bundles app,dmg
          # Note: MacOS builds require valid signing identity for full distribution.
          # If not configured, it will build unsign/ad-hoc.

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libudev-dev xdg-utils file desktop-file-utils
      - name: install frontend dependencies
        working-directory: plan-terminal
        run: npm install
      - name: build tauri app for Raspberry Pi (ARM64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-${{ github.ref_name }}
          releaseName: "Plan Terminal ${{ github.ref_name }}"
          releaseBody: |
            ### 📦 Download & Installation Compatibility Guide:

            | Platform / Operating System | File Name to Download | Target Hardware |
            | :--- | :--- | :--- |
            | 🍓 **Raspberry Pi OS (32-bit `armhf`)** | `Plan.Terminal_*_armhf.deb` | **Raspberry Pi 3, 4, 5 (32-bit OS)** |
            | 🍓 **Raspberry Pi OS (64-bit `arm64`)** | `Plan.Terminal_*_arm64.deb` | **Raspberry Pi 3, 4, 5 (64-bit OS)** |
            | 🍓 **Raspberry Pi Portable (64-bit ARM)** | `Plan.Terminal_aarch64.app.tar.gz` | **Raspberry Pi (Portable tarball)** |
            | 🪟 **Windows PC (64-bit)** | `Plan.Terminal_*_x64-setup.exe` | **Windows 10, 11 (PC / Laptops)** |
            | 🍎 **macOS (Apple Silicon & Intel)** | `Plan.Terminal_*_aarch64.dmg` / `.app` | **MacBook, Mac Mini, iMac** |
            | 🐧 **Linux PC (Debian / Ubuntu x86_64)** | `Plan.Terminal_*_amd64.deb` | **Ubuntu, Debian, Mint PC** |
            | 🐧 **Linux PC (AppImage x86_64)** | `Plan.Terminal_*_amd64.AppImage` | **Fedora, Arch, openSUSE PC** |
          releaseDraft: false
          prerelease: false
          projectPath: plan-terminal

  build-linux-armhf:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - name: install armhf dependencies
        run: |
          sudo dpkg --add-architecture armhf
          sudo bash -c 'cat << EOF > /etc/apt/sources.list.d/armhf.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-security
          Components: main restricted universe multiverse
          Architectures: armhf
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF'
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libwebkit2gtk-4.1-dev:armhf libappindicator3-dev:armhf librsvg2-dev:armhf libssl-dev:armhf libudev-dev:armhf xdg-utils file desktop-file-utils
      - name: install frontend dependencies
        working-directory: plan-terminal
        run: npm install
      - name: build tauri app for Raspberry Pi 32-bit (ARMHF)
        run: |
          export PKG_CONFIG_ALLOW_CROSS="1"
          export PKG_CONFIG_PATH="/usr/lib/arm-linux-gnueabihf/pkgconfig"
          export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER="arm-linux-gnueabihf-gcc"
          cd plan-terminal
          npm run tauri build -- --target armv7-unknown-linux-gnueabihf --bundles deb
          mkdir -p artifacts
          cp src-tauri/target/armv7-unknown-linux-gnueabihf/release/bundle/deb/*.deb artifacts/
      - name: upload armhf release asset
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: app-${{ github.ref_name }}
          files: plan-terminal/artifacts/*.deb
