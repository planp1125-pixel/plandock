<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background: Deep Matte Black -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#09090b"/>
  
  <!-- Terminal Prompt: Neon Green with subtle glow -->
  <g transform="translate(256, 256)" text-anchor="middle" dominant-baseline="central">
    <text x="0" y="20" font-family="monospace" font-weight="900" font-size="280" fill="#4ade80" filter="url(#glow)">&gt;_</text>
  </g>
</svg>
